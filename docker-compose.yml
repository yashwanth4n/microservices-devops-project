services:
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "3000:3000"
    restart: always

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "4000:4000"
    restart: always

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "5000:5000"
    restart: always