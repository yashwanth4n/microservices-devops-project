
services:
  user-service:
    image: 761099337583.dkr.ecr.us-east-1.amazonaws.com/user-service:latest
    container_name: user-service
    expose:
      - "3000"
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  product-service:
    image: 761099337583.dkr.ecr.us-east-1.amazonaws.com/product-service:latest
    container_name: product-service
    expose:
      - "4000"
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  order-service:
    image: 761099337583.dkr.ecr.us-east-1.amazonaws.com/order-service:latest
    container_name: order-service
    expose:
      - "5000"
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    restart: always
