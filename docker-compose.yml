services:
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "3000:3000"
    restart: always

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "4000:4000"
    restart: always

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "5000:5000"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - product-service
      - order-service
    restart: always